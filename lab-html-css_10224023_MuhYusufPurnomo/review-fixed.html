
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kampus STT Cipasung</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        header h1 {
            margin-top: 0;
        }

        nav ul {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            list-style: none;
            padding: 0;
        }

        nav a {
            color: #003366;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main section {
            margin-bottom: 24px;
        }

        h2 {
            color: #003366;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 16px 0;
        }

        form label {
            display: block;
            margin-bottom: 4px;
        }

        form input,
        form textarea {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #999;
            border-radius: 4px;
            font: inherit;
        }

        button {
            padding: 10px 20px;
            color: white;
            background-color: #003366;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            margin-top: 24px;
            padding: 16px;
            text-align: center;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>STT Cipasung</h1>
        <p>Sekolah Tinggi Teknologi Cipasung, Tasikmalaya</p>

        <nav aria-label="Navigasi utama">
            <ul>
                <li><a href="#about">Tentang Kami</a></li>
                <li><a href="#programs">Program Studi</a></li>
                <li><a href="#contact">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>Tentang Kami</h2>
            <p>STT Cipasung adalah sekolah tinggi teknologi di Tasikmalaya.</p>
            <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Ilustrasi profil STT Cipasung">
        </section>

        <section id="programs">
            <h2>Program Studi</h2>
            <ul>
                <li>Teknik Industri</li>
                <li>Informatika</li>
            </ul>
        </section>

        <section id="contact">
            <h2>Kontak</h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </p>
                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 STT Cipasung</p>
    </footer>
</body>
</html>
